<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wegmarken — Collins Ziele</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EEF1F3;
    --card:#FFFFFF;
    --ink:#16232E;
    --ink-2:#3E5061;
    --muted:#75879A;
    --faint:#A8B6C4;
    --rule:#DCE3E9;
    --rule-soft:#E9EEF2;
    --accent:#3B6FD4;
    --ok:#16A379;
    --warn:#D9822B;
    --alert:#D14D5C;
    --chart-grid:#EDF1F4;
    --chart-grid-strong:#D3DCE3;
    --track:#EBF0F4;
    --note-bg:#F5F8FA;
    --field-bg:#F7FAFB;
    --hover:#E4E9ED;
    --today-fill:#16232E;
    --r:16px;
  }
  /* Dark-Mode — auf Notions dunklen Hintergrund (#191919) abgestimmt */
  html[data-theme="dark"]{
    --paper:#191919;
    --card:#242424;
    --ink:#EDEDED;
    --ink-2:#C4C4C4;
    --muted:#9B9B9B;
    --faint:#6E6E6E;
    --rule:#383838;
    --rule-soft:#2E2E2E;
    --accent:#5B8FC9;
    --ok:#4FB894;
    --warn:#E0A24E;
    --alert:#D97A70;
    --chart-grid:#2E2E2E;
    --chart-grid-strong:#3E3E3E;
    --track:#333333;
    --note-bg:#2A2A2A;
    --field-bg:#1F1F1F;
    --hover:#2E2E2E;
    --today-fill:#EDEDED;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .serif{font-family:'Fraunces',Georgia,serif}
  .lab{
    font-size:10.5px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)
  }

  /* ---------------- Shell ---------------- */
  .shell{display:flex;min-height:100vh}
  .side{
    width:238px;flex:none;padding:26px 16px;position:sticky;top:0;height:100vh;overflow-y:auto;
    border-right:1px solid var(--rule)
  }
  .mark{padding:0 8px 6px}
  .mark .kick{font-size:10px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--faint)}
  .mark h1{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:23px;margin:6px 0 3px;line-height:1.1}
  .mark .who{font-size:12px;color:var(--muted)}

  nav{margin-top:24px;display:flex;flex-direction:column;gap:2px}
  .nv{
    display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:10px;
    font-size:14px;font-weight:500;color:var(--ink-2);cursor:pointer;border:0;background:none;
    font-family:'Inter',sans-serif;text-align:left;width:100%;transition:background .14s ease,color .14s ease
  }
  .nv .dt{width:8px;height:8px;border-radius:50%;flex:none;background:var(--faint)}
  .nv .n{flex:1}
  .nv .k{font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums}
  .nv:hover{background:var(--hover);color:var(--ink)}
  .nv.on{background:var(--ink);color:#fff}
  .nv.on .k{color:rgba(255,255,255,.6)}
  .nv.sub{padding-left:26px;font-size:13.5px}
  .nv .caret{font-size:10px;color:var(--faint);transition:transform .16s ease}
  .nv.open .caret{transform:rotate(90deg)}
  .side .tools{margin-top:26px;padding-top:18px;border-top:1px solid var(--rule);display:flex;flex-direction:column;gap:8px}

  .main{flex:1;min-width:0;padding:38px 40px 90px}
  .inner{max-width:1000px;margin:0 auto}

  /* ---------------- Buttons ---------------- */
  .btn{
    background:var(--card);border:1px solid var(--rule);color:var(--ink);
    font-family:'Inter',sans-serif;font-size:13px;font-weight:500;padding:8px 14px;border-radius:10px;
    cursor:pointer;transition:all .14s ease;display:inline-flex;align-items:center;gap:7px
  }
  .btn:hover{border-color:var(--faint);background:var(--card)}
  .btn.sm{padding:6px 11px;font-size:12.5px}
  .btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
  .btn.dark:hover{background:#22323f}
  .btn.plain{background:transparent;border-color:transparent;color:var(--muted)}
  .btn.plain:hover{color:var(--ink);background:var(--hover)}
  .btn.block{width:100%;justify-content:center}
  .btn.danger{color:var(--alert);border-color:color-mix(in srgb,var(--alert) 40%,transparent)}
  .btn.danger:hover{background:color-mix(in srgb,var(--alert) 12%,transparent);border-color:var(--alert)}

  /* ---------------- Hero ---------------- */
  .hero{margin-bottom:34px}
  .hero .eyebrow{display:flex;align-items:center;gap:9px;margin-bottom:14px}
  .hero .eyebrow .dt{width:9px;height:9px;border-radius:50%}
  .hero h2{
    font-family:'Fraunces',Georgia,serif;font-weight:500;font-size:40px;line-height:1.16;
    margin:0;letter-spacing:-.015em;max-width:20ch
  }
  .hero h2 em{font-style:normal;font-weight:600;color:var(--hc,var(--accent))}
  .hero .under{margin-top:14px;font-size:14.5px;color:var(--ink-2);max-width:60ch;line-height:1.6}
  .hero .actions{margin-top:20px;display:flex;gap:9px;flex-wrap:wrap}

  /* ---------------- Metric strip ---------------- */
  .strip{display:flex;flex-wrap:wrap;gap:0;background:var(--card);border:1px solid var(--rule);
    border-radius:var(--r);overflow:hidden;margin-bottom:34px}
  .strip .m{flex:1;min-width:150px;padding:18px 20px;border-right:1px solid var(--rule-soft)}
  .strip .m:last-child{border-right:0}
  .strip .m .v{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:30px;line-height:1;
    letter-spacing:-.02em;margin:8px 0 5px;font-variant-numeric:tabular-nums}
  .strip .m .v small{font-family:'Inter',sans-serif;font-size:13px;font-weight:500;color:var(--muted);letter-spacing:0}
  .strip .m .s{font-size:12.5px;color:var(--muted);line-height:1.4}
  .strip .m .s b{color:var(--ink);font-weight:600}

  /* ---------------- Section ---------------- */
  .sec{margin-bottom:38px}
  .sh{display:flex;align-items:center;gap:14px;margin-bottom:15px}
  .sh h3{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:17px;margin:0;letter-spacing:-.01em}
  .sh .ln{flex:1;height:1px;background:var(--rule)}
  .seg{display:inline-flex;border:1px solid var(--rule);border-radius:9px;overflow:hidden;background:var(--card)}
  .seg button{background:none;border:0;color:var(--muted);font-size:12px;padding:6px 11px;cursor:pointer;
    font-family:'Inter',sans-serif}
  .seg button+button{border-left:1px solid var(--rule)}
  .seg button.on{background:var(--ink);color:#fff}

  /* ---------------- Next steps ---------------- */
  .steps{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:6px 20px}
  .steps .row{display:flex;align-items:flex-start;gap:13px;padding:14px 0;border-bottom:1px solid var(--rule-soft)}
  .steps .row:last-child{border-bottom:0}
  .box{width:19px;height:19px;border-radius:6px;border:1.6px solid var(--faint);flex:none;cursor:pointer;
    display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;margin-top:1px;
    transition:all .14s ease;background:transparent}
  .box:hover{border-color:var(--ink)}
  .row.done .box{background:var(--ok);border-color:var(--ok)}
  .row .tx{flex:1;font-size:14.5px;line-height:1.45}
  .row.done .tx{color:var(--faint);text-decoration:line-through}
  .row .tx .cad{display:block;font-size:12px;color:var(--muted);margin-top:3px;text-decoration:none}
  .row .x{background:none;border:0;color:var(--faint);cursor:pointer;font-size:15px;padding:2px 4px;line-height:1}
  .row .x:hover{color:var(--alert)}
  .steps .addrow{padding:13px 0;border-top:1px solid var(--rule-soft)}
  .steps .addrow input{width:100%;border:0;outline:none;font-family:'Inter',sans-serif;font-size:14px;
    background:transparent;color:var(--ink)}
  .steps .addrow input::placeholder{color:var(--faint)}

  /* ---------------- Timeline ---------------- */
  .tl{display:flex;background:var(--card);border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
  .gut{flex:none;width:132px;border-right:1px solid var(--rule);z-index:3;background:var(--card)}
  .gut .ga{height:42px;border-bottom:1px solid var(--rule-soft)}
  .gut .gl{height:92px;display:flex;flex-direction:column;justify-content:center;padding:0 14px;
    border-bottom:1px solid var(--rule-soft)}
  .gut .gl:last-child{border-bottom:0}
  .gl .gn{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600}
  .gl .gn .dt{width:8px;height:8px;border-radius:50%}
  .gl .gm{font-size:11px;color:var(--faint);margin-top:3px}
  .brd{flex:1;overflow-x:auto;overflow-y:hidden;position:relative}
  .bin{position:relative}
  .brd svg{position:absolute;top:0;left:0;display:block}
  .lay{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
  .nd{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;width:0}
  .nd .dt{position:absolute;left:0;top:0;transform:translate(-50%,-50%);width:14px;height:14px;border-radius:50%;
    cursor:pointer;border:2.5px solid var(--card);background:var(--tc);box-shadow:0 0 0 1px var(--tc);
    transition:transform .15s ease;padding:0}
  .nd.major .dt{width:19px;height:19px}
  .nd.planned .dt{background:var(--card);box-shadow:0 0 0 1.8px var(--tc)}
  .nd.progress .dt{background:var(--tc);box-shadow:0 0 0 4px color-mix(in srgb,var(--tc) 22%,transparent)}
  .nd.done .dt::after{content:"✓";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:9px;color:#fff;font-weight:700}
  .nd.major.done .dt::after{font-size:11px}
  .nd.due .dt{background:var(--card);box-shadow:0 0 0 1.8px var(--alert)}
  .nd.start .dt{width:10px;height:10px;background:var(--faint);box-shadow:0 0 0 1px var(--faint)}
  .nd .dt:hover{transform:translate(-50%,-50%) scale(1.28)}
  .nd .dt:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
  .nd .lb{position:absolute;left:11px;width:146px;font-size:11.5px;line-height:1.3;color:var(--ink-2);cursor:pointer;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .nd .lb .dd{display:block;font-size:10px;color:var(--faint);margin-bottom:2px;font-variant-numeric:tabular-nums}
  .nd.above .lb{bottom:11px}
  .nd.below .lb{top:11px}
  .nd.dim .lb{color:var(--faint)}
  .nd .lb:hover{color:var(--ink)}
  .axl{font-size:10px;fill:var(--faint)}
  .axy{font-size:11.5px;font-weight:600;fill:var(--ink-2)}
  .kvl{font-size:9.5px;font-weight:600;letter-spacing:.06em}

  /* ---------------- Cards / charts ---------------- */
  .grid{display:grid;gap:14px}
  .grid.two{grid-template-columns:repeat(auto-fit,minmax(310px,1fr))}
  .card{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:20px}
  .card h4{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:15.5px;margin:0 0 3px}
  .card .cs{font-size:12.5px;color:var(--muted);margin-bottom:16px}
  .cax{font-size:9.5px;fill:var(--faint)}
  .cnum{font-size:10.5px;font-weight:600;font-variant-numeric:tabular-nums}
  .lg{display:flex;gap:16px;font-size:11.5px;color:var(--muted);margin-top:10px}
  .lg span{display:inline-flex;align-items:center;gap:6px}
  .lg i{width:16px;height:0;border-top:2px solid;display:inline-block}
  .lg i.d{border-top-style:dashed}

  .pb{margin-bottom:16px}
  .pb .pl{display:flex;justify-content:space-between;font-size:13px;margin-bottom:7px}
  .pb .pl .pv{color:var(--muted);font-variant-numeric:tabular-nums}
  .pb .tr{height:8px;background:var(--track);border-radius:99px;position:relative;overflow:hidden}
  .pb .fl{height:100%;border-radius:99px;background:var(--pc)}
  .pb .tk{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.45}

  .lst{list-style:none;margin:0;padding:0}
  .lst li{display:flex;gap:13px;padding:10px 0;border-bottom:1px solid var(--rule-soft);font-size:13.5px;line-height:1.5}
  .lst li:last-child{border-bottom:0}
  .lst li .k{color:var(--faint);flex:none;width:76px;font-size:12px;padding-top:1px}
  .note{background:var(--note-bg);border:1px solid var(--rule-soft);border-radius:11px;padding:13px 15px;
    font-size:13px;color:var(--ink-2);line-height:1.55}
  .note b{color:var(--ink)}
  .quote{border-left:3px solid var(--qc,var(--accent));padding:4px 0 4px 16px;margin:0 0 18px;
    font-family:'Fraunces',Georgia,serif;font-size:15px;line-height:1.5;color:var(--ink)}
  .empty{border:1px dashed var(--rule);border-radius:12px;padding:26px;text-align:center;color:var(--muted);font-size:13.5px}

  /* folder page */
  .folder{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
  .fc{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:18px;cursor:pointer;
    text-align:left;font-family:'Inter',sans-serif;transition:all .14s ease;position:relative;overflow:hidden}
  .fc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--fc)}
  .fc:hover{border-color:var(--faint);transform:translateY(-1px)}
  .fc .fn{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:16.5px;margin-bottom:7px}
  .fc .fm{font-size:12.5px;color:var(--muted);line-height:1.5}
  .fc .fm b{color:var(--ink);font-weight:600}

  /* ---------------- Drawer / modal ---------------- */
  .dw{position:fixed;top:0;right:0;height:100%;width:min(390px,93vw);z-index:60;background:var(--card);
    border-left:1px solid var(--rule);box-shadow:-20px 0 50px rgba(22,35,46,.10);transform:translateX(105%);
    transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding:26px}
  .dw.open{transform:translateX(0)}
  .dw .tag{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:600;padding:5px 11px;
    border-radius:999px;align-self:flex-start;border:1px solid var(--rule)}
  .dw .tag .dt{width:8px;height:8px;border-radius:50%}
  .dw .dd{font-size:12.5px;color:var(--muted);margin:18px 0 7px;font-variant-numeric:tabular-nums}
  .dw h2{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:23px;line-height:1.24;margin:0 0 16px}
  .dw .mtx{font-size:14px;line-height:1.6;white-space:pre-wrap;background:var(--note-bg);border:1px solid var(--rule-soft);
    border-radius:11px;padding:14px 16px;color:var(--ink-2)}
  .srow{display:flex;gap:8px;margin-top:20px}
  .srow button{flex:1;padding:9px;border-radius:9px;border:1px solid var(--rule);background:var(--card);
    color:var(--muted);font-size:12.5px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif}
  .srow button.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .dw .acts{margin-top:auto;display:flex;gap:10px;padding-top:22px}
  .dw .acts .btn{flex:1;justify-content:center}
  .dw .cl{position:absolute;top:18px;right:18px;background:none;border:0;color:var(--faint);font-size:21px;
    cursor:pointer;line-height:1;padding:4px}
  .dw .cl:hover{color:var(--ink)}
  .ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:70;display:none;align-items:center;
    justify-content:center;padding:20px;backdrop-filter:blur(2px)}
  .ov.open{display:flex}
  .md{background:var(--card);border:1px solid var(--rule);border-radius:18px;width:min(470px,100%);padding:28px;
    max-height:92vh;overflow-y:auto;box-shadow:0 24px 60px rgba(22,35,46,.16)}
  .md h3{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:20px;margin:0 0 20px}
  .fd{margin-bottom:16px}
  .fd label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:7px}
  .fd input,.fd select,.fd textarea{width:100%;background:var(--field-bg);border:1px solid var(--rule);border-radius:10px;
    color:var(--ink);font-family:'Inter',sans-serif;font-size:14px;padding:10px 12px;outline:none}
  .fd input:focus,.fd select:focus,.fd textarea:focus{border-color:var(--accent);background:var(--card)}
  .fd textarea{resize:vertical;min-height:74px}
  .fd.row{display:flex;gap:12px}.fd.row>div{flex:1}
  .crow{display:flex;gap:8px;flex-wrap:wrap}
  .cs2{width:30px;height:30px;border-radius:8px;cursor:pointer;border:2px solid transparent}
  .cs2.on{border-color:var(--ink)}
  .mact{display:flex;gap:10px;margin-top:24px}.mact .btn{flex:1;justify-content:center}

  /* ---------------- XP / Level ---------------- */
  .xpwrap{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:22px 24px;margin-bottom:34px}
  .xphead{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px}
  .xphead .xt{font-family:'Fraunces',Georgia,serif;font-size:17px;font-weight:600}
  .xphead .xs{font-size:12.5px;color:var(--muted);margin-top:2px}
  .xptot{text-align:right}
  .xptot .lv{font-family:'Fraunces',Georgia,serif;font-size:34px;font-weight:600;line-height:1;letter-spacing:-.02em}
  .xptot .st{font-size:11px;color:var(--muted);margin-top:2px}
  .xptot .lb{font-size:9.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
  .xpgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
  .xpc{padding:0}
  .xpc .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
  .xpc .nm{font-size:12.5px;font-weight:600;color:var(--ink-2);display:flex;align-items:center;gap:7px}
  .xpc .nm .dt{width:8px;height:8px;border-radius:50%;flex:none}
  .xpc .lv{font-family:'Fraunces',Georgia,serif;font-size:19px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
  .xpc .tr{height:5px;background:var(--track);border-radius:99px;overflow:hidden}
  .xpc .fl{height:100%;border-radius:99px;transition:width .6s cubic-bezier(.4,0,.2,1)}
  .xpc .sub{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
  .xpsync{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--muted);margin-top:18px;padding-top:16px;border-top:1px solid var(--rule-soft)}
  .xpsync .d{width:6px;height:6px;border-radius:50%;background:var(--ok);flex:none}
  .xpsync .d.stale{background:var(--faint)}

  @media (max-width:860px){
    .shell{flex-direction:column}
    .side{width:100%;height:auto;position:static;border-right:0;border-bottom:1px solid var(--rule);padding:18px}
    nav{flex-direction:row;flex-wrap:wrap;margin-top:16px}
    .nv{width:auto}
    .nv.sub{padding-left:11px}
    .side .tools{flex-direction:row;flex-wrap:wrap}
    .side .tools .btn{flex:1}
    .main{padding:26px 18px 70px}
    .hero h2{font-size:29px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<script>
  (function(){
    var saved=null;
    try{saved=localStorage.getItem("wegmarken-theme");}catch(e){}
    var dark = saved ? saved==="dark" : (window.matchMedia&&window.matchMedia("(prefers-color-scheme:dark)").matches);
    document.documentElement.setAttribute("data-theme",dark?"dark":"light");
  })();
</script>
<div class="shell">
  <aside class="side">
    <div class="mark">
      <div class="kick">Ziele</div>
      <h1>Wegmarken</h1>
      <div class="who">Collin · Mannheim &amp; Peking</div>
    </div>
    <nav id="nav"></nav>
    <div class="tools">
      <button class="btn sm block dark" id="bAdd">Meilenstein hinzufügen</button>
      <button class="btn sm block" id="bUp">Wochen-Update</button>
      <button class="btn sm block plain" id="bData">Daten &amp; Backup</button>
      <button class="btn sm block plain" id="bTheme">◐ Hell / Dunkel</button>
    </div>
  </aside>
  <main class="main"><div class="inner" id="view"></div></main>
</div>

<div class="dw" id="dw"><button class="cl" id="dwClose" aria-label="Schließen">✕</button><div id="dwBody"></div></div>
<div class="ov" id="ov"><div class="md" id="md"></div></div>

<script>

/* ============ STORAGE ============ */
const KEY="wegmarken_v3";
async function load(){
  try{if(window.storage&&window.storage.get){const r=await window.storage.get(KEY);return r&&r.value?JSON.parse(r.value):null;}}catch(e){}
  try{const v=localStorage.getItem(KEY);return v?JSON.parse(v):null;}catch(e){return null;}
}
async function save(o){const s=JSON.stringify(o);
  try{if(window.storage&&window.storage.set){await window.storage.set(KEY,s);return;}}catch(e){}
  try{localStorage.setItem(KEY,s);}catch(e){}}

function d(s){const[y,m,dd]=s.split("-").map(Number);return new Date(y,m-1,dd,12);}
function diff(a,b){return Math.round((a-b)/86400000);}
function fmt(x){return x.toLocaleDateString("de-DE",{day:"2-digit",month:"short",year:"numeric"});}
function iso(){const p=n=>String(n).padStart(2,"0");return `${TODAY.getFullYear()}-${p(TODAY.getMonth()+1)}-${p(TODAY.getDate())}`;}
function nf(n){return n.toLocaleString("de-DE");}

/* Theme-aware CSS-Variablen-Lookup für SVG-Rendering */
function cssv(name){return getComputedStyle(document.documentElement).getPropertyValue(name).trim();}

/* ============ XP-ENGINE ============ */
const XP_URL="./notion-xp.json";
const THRESH=[0,500,1200,2200,3600,5500,8000,11000,15000,20000,26000];
const STUFEN=["Anfang","Aufbau","Solide","Fortgeschritten","Kompetent","Stark","Etabliert","Sehr stark","Exzellent","Meisterhaft"];
function xpLvl(xp){let l=1;for(let i=1;i<THRESH.length;i++)if(xp>=THRESH[i])l=i+1;else break;return Math.min(l,10);}
function xpBar(xp){const l=xpLvl(xp);if(l>=10)return{pct:100,cur:xp-THRESH[9],need:6000};
  const s=THRESH[l-1],e=THRESH[l];return{pct:Math.round(((xp-s)/(e-s))*100),cur:xp-s,need:e-s};}
function xpFor(key){
  const base=(D.xp&&D.xp.base&&D.xp.base[key])||0;
  const sync=(D.xp&&D.xp.synced&&D.xp.synced[key])||0;
  return sync||base; // synced total already includes base from the sync script
}
function xpToast(msg){
  let t=document.getElementById("xptoast");
  if(!t){t=document.createElement("div");t.id="xptoast";
    t.style.cssText="position:fixed;top:0;left:0;right:0;background:var(--card);border-bottom:1px solid var(--accent);color:var(--accent);padding:12px 20px;text-align:center;font-size:13px;font-weight:600;z-index:999;transform:translateY(-100%);transition:transform .25s;font-family:Inter,sans-serif";
    document.body.appendChild(t);}
  t.textContent=msg;t.style.transform="translateY(0)";
  setTimeout(()=>{t.style.transform="translateY(-100%)";},2400);
}
async function loadXP(){
  try{const r=await fetch(XP_URL,{cache:"no-store"});if(!r.ok)return;
    const j=await r.json();
    if(j&&j.total_xp){D.xp.synced=j.total_xp;D.xp.syncedAt=j.synced_at;}
  }catch(e){}
}
async function persist(){await save(D);}

function msFor(areaId,subjId){

}
function nextMs(areaId,subjId){
  const p=(areaId||subjId)?msFor(areaId,subjId):D.ms;
  return p.filter(m=>!m.start&&m.status!=="done"&&d(m.date)>=TODAY).sort((a,b)=>d(a.date)-d(b.date))[0]||null;
}
function stepsFor(areaId,subjId){
  return D.steps.filter(s=>subjId?s.subject===subjId:(s.area===areaId&&!s.subject));
}
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");}

            `<span class="dt" style="background:${s.color}"></span><span class="n">${s.name}</span><span class="k">${c}</span>`,
            ()=>go("subject",s.id));

      }

      const c=D.ms.filter(m=>m.area===a.id&&!m.start).length;

        `<span class="dt" style="background:${a.color}"></span><span class="n">${a.name}</span><span class="k">${c}</span>`,
        ()=>go("area",a.id));
    }
  });

function go(view,id){R={view,id:id||null};render();window.scrollTo(0,0);}

/* ============ TIMELINE ============ */
const LP=30,RP=84,AX=42,LH=92;
function timeline(mount,lanes,ms,opt){
  opt=opt||{};const TH=THEME();
  mount.innerHTML=`<div class="tl"><div class="gut"></div><div class="brd"><div class="bin">
    <svg xmlns="http://www.w3.org/2000/svg"></svg><div class="lay"></div></div></div></div>`;
  const gut=mount.querySelector(".gut"),brd=mount.querySelector(".brd"),bin=mount.querySelector(".bin"),
        svg=mount.querySelector("svg"),lay=mount.querySelector(".lay");
  if(!ms.length){mount.innerHTML=`<div class="empty">Noch keine Meilensteine. Leg den ersten an.</div>`;return;}
  let mn=d("2026-08-01").getTime(),mx=TODAY.getTime();
  ms.forEach(m=>{const t=d(m.date).getTime();if(t<mn)mn=t;if(t>mx)mx=t;});
  (opt.keyLines||[]).forEach(k=>{const t=d(k.date).getTime();if(t>mx)mx=t;});
  mx+=70*86400000; const dm={min:new Date(mn),max:new Date(mx)};
  const X=x=>LP+diff(x,dm.min)*zoom;
  const W=X(dm.max)+RP,H=AX+lanes.length*LH+4;
  bin.style.width=W+"px";bin.style.height=H+"px";
  svg.setAttribute("width",W);svg.setAttribute("height",H);svg.setAttribute("viewBox",`0 0 ${W} ${H}`);

  let g=`<div class="ga"></div>`;
  lanes.forEach(l=>{const c=ms.filter(l.match).filter(m=>!m.start).length;
    g+=`<div class="gl"><div class="gn"><span class="dt" style="background:${l.color}"></span>${l.name}</div>
      <div class="gm">${c} ${c===1?"Ziel":"Ziele"}</div></div>`;});
  gut.innerHTML=g;

  let s="";
  (opt.keyZones||[]).forEach(z=>{const a=X(d(z.from)),b=X(d(z.to));
    s+=`<rect x="${a}" y="${AX}" width="${b-a}" height="${H-AX}" fill="${z.color}" opacity="0.06"/>`;});
  let cur=new Date(dm.min.getFullYear(),dm.min.getMonth(),1,12);
  const every=zoom>=1.4;
  while(cur<=dm.max){const x=X(cur),jan=cur.getMonth()===0,q=cur.getMonth()%3===0;
    if(x>=LP-1){s+=`<line x1="${x}" y1="${AX}" x2="${x}" y2="${H}" stroke="${jan?TH.gridStrong:TH.grid}"/>`;
      if(every||q)s+=`<text class="axl" x="${x+5}" y="15">${MO[cur.getMonth()]}</text>`;
      if(jan)s+=`<text class="axy" x="${x+5}" y="32">${cur.getFullYear()}</text>`;}
    cur.setMonth(cur.getMonth()+1);}
  lanes.forEach((l,i)=>{const y=AX+i*LH+LH/2;
    s+=`<line x1="${LP}" y1="${y}" x2="${W-RP+40}" y2="${y}" stroke="${l.color}" stroke-opacity="0.2" stroke-width="1.5"/>`;
    if(i>0)s+=`<line x1="0" y1="${AX+i*LH}" x2="${W}" y2="${AX+i*LH}" stroke="${TH.grid}"/>`;});
  (opt.keyLines||[]).forEach(k=>{const x=X(d(k.date));
    s+=`<line x1="${x}" y1="${AX}" x2="${x}" y2="${H}" stroke="${k.color}" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.5"/>
      <text class="kvl" x="${x+6}" y="${AX+13}" fill="${k.color}">${k.label}</text>`;});
  const xt=X(TODAY);
  s+=`<rect x="0" y="${AX}" width="${xt}" height="${H-AX}" fill="${TH.today}" opacity="0.028"/>
    <line x1="${xt}" y1="${AX-5}" x2="${xt}" y2="${H}" stroke="${TH.today}" stroke-width="1.6"/>
    <circle cx="${xt}" cy="${AX-5}" r="3.5" fill="${TH.today}"/>
    <text class="kvl" x="${xt+7}" y="${AX-6}" fill="${TH.today}">HEUTE</text>`;
  svg.innerHTML=s;

  lay.innerHTML="";
  lanes.forEach((l,i)=>{const y=AX+i*LH+LH/2;
    ms.filter(l.match).sort((a,b)=>d(a.date)-d(b.date)).forEach((m,idx)=>{
      const x=X(d(m.date)),past=d(m.date)<TODAY;
      let st=m.status; if(m.start)st="start"; else if(m.status==="planned"&&past)st="due";
      const above=idx%2===0,el=document.createElement("div");
      el.className=`nd ${st} ${m.major?"major":""} ${above?"above":"below"} ${past&&m.status!=="done"&&!m.start?"dim":""}`;
      el.style.left=x+"px";el.style.top=y+"px";el.style.setProperty("--tc",l.color);
      el.innerHTML=`<button class="dt" aria-label="${esc(m.title)}"></button>
        <div class="lb"><span class="dd">${fmt(d(m.date))}</span>${esc(m.title)}</div>`;
      el.querySelector(".dt").onclick=()=>detail(m.id);
      el.querySelector(".lb").onclick=()=>detail(m.id);
      lay.appendChild(el);});
  });
  requestAnimationFrame(()=>{brd.scrollLeft=Math.max(0,xt-150);});
}

/* ============ CHART ============ */
function chart(mount,se){
  const H=210,W=Math.max(280,mount.clientWidth||500),PL=46,PR=56,PT=14,PB=26;
  const pts=se.points.map(p=>({...p,t:d(p.date).getTime()}));
  if(!pts.length){mount.innerHTML=`<div class="empty">Noch keine Werte.</div>`;return;}
  let t0=Math.min(...pts.map(p=>p.t)),t1=Math.max(...pts.map(p=>p.t));if(t0===t1)t1=t0+2592000000;
  let v0=Math.min(...pts.map(p=>p.value)),v1=Math.max(...pts.map(p=>p.value));
  const pad=(v1-v0)*0.15||v1*0.1||1;const lo=Math.max(0,v0-pad),hi=v1+pad;
  const X=t=>PL+(t-t0)/(t1-t0)*(W-PL-PR),Y=v=>PT+(1-(v-lo)/(hi-lo))*(H-PT-PB);
  const plan=pts.filter(p=>p.plan).sort((a,b)=>a.t-b.t),act=pts.filter(p=>!p.plan).sort((a,b)=>a.t-b.t);
  let s=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
  const TH=THEME();
  for(let i=0;i<=4;i++){const v=lo+(hi-lo)*i/4,y=Y(v);
    s+=`<line x1="${PL}" y1="${y}" x2="${W-PR}" y2="${y}" stroke="${TH.grid}"/>
      <text class="cax" x="${PL-8}" y="${y+3}" text-anchor="end">${nf(Math.round(v))}</text>`;}
  [t0,(t0+t1)/2,t1].forEach(t=>{const x=new Date(t);
    s+=`<text class="cax" x="${X(t)}" y="${H-8}" text-anchor="middle">${MO[x.getMonth()]} ${String(x.getFullYear()).slice(2)}</text>`;});
  if(TODAY.getTime()>=t0&&TODAY.getTime()<=t1){const x=X(TODAY.getTime());
    s+=`<line x1="${x}" y1="${PT}" x2="${x}" y2="${H-PB}" stroke="${TH.today}" stroke-opacity="0.28" stroke-dasharray="3 3"/>`;}
  const pth=a=>a.map((p,i)=>`${i?"L":"M"}${X(p.t)},${Y(p.value)}`).join(" ");
  if(plan.length>1)s+=`<path d="${pth(plan)}" fill="none" stroke="${se.color}" stroke-width="1.8" stroke-dasharray="5 5" opacity="0.45"/>`;
  plan.forEach(p=>s+=`<circle cx="${X(p.t)}" cy="${Y(p.value)}" r="3.2" fill="${TH.card}" stroke="${se.color}" stroke-width="1.5" opacity="0.6"/>`);
  if(plan.length){const l=plan[plan.length-1];
    s+=`<text class="cnum" x="${X(l.t)+7}" y="${Y(l.value)+4}" fill="${se.color}" opacity="0.75">${nf(l.value)}</text>`;}
  if(act.length){
    if(act.length>1){s+=`<path d="${pth(act)} L${X(act[act.length-1].t)},${H-PB} L${X(act[0].t)},${H-PB} Z" fill="${se.color}" opacity="0.07"/>`;}
    s+=`<path d="${pth(act)}" fill="none" stroke="${se.color}" stroke-width="2.4" stroke-linecap="round"/>`;
    act.forEach(p=>s+=`<circle cx="${X(p.t)}" cy="${Y(p.value)}" r="4" fill="${se.color}" stroke="${TH.card}" stroke-width="1.5"/>`);
    const l=act[act.length-1];
    s+=`<text class="cnum" x="${X(l.t)+7}" y="${Y(l.value)-7}" fill="${TH.ink}">${nf(l.value)}</text>`;}
  s+=`</svg>`;
  mount.innerHTML=s+`<div class="lg"><span><i class="d" style="border-color:${se.color}"></i>Plan</span>
    <span><i style="border-color:${se.color}"></i>Dein Stand</span></div>`;
}

function pb(label,cur,target,color,unit){unit=unit===undefined?" %":unit;
  return `<div class="pb" style="--pc:${color}"><div class="pl"><span>${label}</span>
    <span class="pv">${cur}${unit} → ${target}${unit}</span></div>
    <div class="tr"><div class="fl" style="width:${Math.min(100,cur)}%"></div>
    <div class="tk" style="left:${Math.min(100,target)}%"></div></div></div>`;}

/* ============ STEPS UI ============ */
function stepsHTML(list,areaId,subjId){
  const rows=list.map(s=>`<div class="row ${s.done?"done":""}" data-step="${s.id}">
      <button class="box">${s.done?"✓":""}</button>
      <div class="tx">${esc(s.text)}${s.cad?`<span class="cad">${esc(s.cad)}</span>`:""}</div>
      <button class="x" title="Entfernen">×</button></div>`).join("");
  return `<div class="steps">${rows||`<div style="padding:20px 0;color:var(--faint);font-size:13.5px">Noch keine Schritte — schreib den ersten unten rein.</div>`}
    <div class="addrow"><input placeholder="+ Nächsten Schritt hinzufügen …" data-newstep="${areaId||""}|${subjId||""}"></div></div>`;
}
function wireSteps(scope){
  scope.querySelectorAll("[data-step]").forEach(row=>{
    const st=D.steps.find(x=>x.id===row.dataset.step);
    row.querySelector(".box").onclick=async()=>{st.done=!st.done;await persist();render();};
    row.querySelector(".x").onclick=async()=>{D.steps=D.steps.filter(x=>x.id!==st.id);await persist();render();};
  });
  const inp=scope.querySelector("[data-newstep]");
  if(inp)inp.onkeydown=async e=>{
    if(e.key!=="Enter")return;
    const v=inp.value.trim();if(!v)return;
    const[a,s]=inp.dataset.newstep.split("|");
    const o={id:"st"+Date.now(),text:v,done:false};
    if(s)o.subject=s; if(a)o.area=a;
    D.steps.push(o);await persist();render();
  };
}

/* ============ RENDER ============ */
function render(){
  renderNav();
  const v=document.getElementById("view");
  if(R.view==="overview")overview(v);
  else if(R.view==="subject")subjectPage(v,R.id);
  else{const a=D.areas.find(x=>x.id===R.id);
    if(!a)return overview(v);
    a.kind==="folder"?folderPage(v,a):areaPage(v,a);}
}
function seg(){return `<div class="seg">${[["0.85","Weit"],["1.7","Mittel"],["3.1","Nah"]]
  .map(([z,l])=>`<button data-z="${z}" class="${parseFloat(z)===zoom?"on":""}">${l}</button>`).join("")}</div>`;}
function wireSeg(sc){sc.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{zoom=parseFloat(b.dataset.z);render();});}

function wireCommon(v){
  v.querySelectorAll("[data-addms]").forEach(b=>b.onclick=()=>editor(null,b.dataset.addms,b.dataset.subj));
  v.querySelectorAll("[data-addse]").forEach(b=>b.onclick=()=>seriesEditor(b.dataset.addse));
  v.querySelectorAll("[data-log]").forEach(b=>b.onclick=()=>logVal(b.dataset.log));
  v.querySelectorAll("[data-addsub]").forEach(b=>b.onclick=()=>openSubject(b.dataset.addsub));
  v.querySelectorAll("[data-editsub]").forEach(b=>b.onclick=()=>openSubject(null,b.dataset.editsub));
}

/* ============ DRAWER ============ */
function detail(id){
  const m=D.ms.find(x=>x.id===id);const a=D.areas.find(x=>x.id===m.area);
  const su=m.subject?D.subjects.find(x=>x.id===m.subject):null;
  const col=su?su.color:a.color,lab=su?`${a.name} · ${su.name}`:a.name;
  document.getElementById("dwBody").innerHTML=`
    <div class="tag" style="color:${col}"><span class="dt" style="background:${col}"></span>${lab}</div>
    <div class="dd">${fmt(d(m.date))}</div><h2>${esc(m.title)}</h2>
    <div class="lab" style="margin-bottom:8px">Woran du es merkst</div>
    <div class="mtx">${esc(m.metric||"—")}</div>
    <div class="srow" id="sr">${[["planned","Geplant"],["progress","Läuft"],["done","Erreicht"]]
      .map(([x,l])=>`<button data-s="${x}" class="${m.status===x?"on":""}">${l}</button>`).join("")}</div>
    <div class="acts"><button class="btn" id="ed">Bearbeiten</button><button class="btn danger" id="dl">Löschen</button></div>`;
  document.querySelectorAll("#sr button").forEach(b=>b.onclick=async()=>{
    const wasNotDone=m.status!=="done";
    m.status=b.dataset.s;
    if(b.dataset.s==="done"&&wasNotDone){
      // Meilenstein erreicht → XP-Notiz (der eigentliche XP-Wert kommt via Notion-Sync,
      // aber wir markieren lokal für sofortiges Feedback)
      xpToast(m.major?"Großer Meilenstein erreicht":"Meilenstein erreicht");
    }
    await persist();detail(id);render();});
  document.getElementById("ed").onclick=()=>editor(m,m.area,m.subject);
  document.getElementById("dl").onclick=async()=>{if(confirm(`„${m.title}" löschen?`)){
    D.ms=D.ms.filter(x=>x.id!==id);await persist();closeDw();render();}};
  document.getElementById("dw").classList.add("open");
}
function closeDw(){document.getElementById("dw").classList.remove("open");}
function openOv(){document.getElementById("ov").classList.add("open");}
function closeOv(){document.getElementById("ov").classList.remove("open");}

/* ============ EDITORS ============ */
function editor(m,presetArea,presetSubj){
  const isNew=!m;
  const c=m||{area:presetArea||D.areas[0].id,subject:presetSubj,date:iso(),title:"",metric:"",status:"planned"};
  const subSel=ar=>{const su=D.subjects.filter(x=>x.area===ar);if(!su.length)return"";
    return `<div class="fd"><label>Fach</label><select id="fS"><option value="">— Rahmen (kein Fach) —</option>
      ${su.map(x=>`<option value="${x.id}" ${c.subject===x.id?"selected":""}>${x.name}</option>`).join("")}</select></div>`;};
  document.getElementById("md").innerHTML=`<h3>${isNew?"Neuer Meilenstein":"Bearbeiten"}</h3>
    <div class="fd"><label>Bereich</label><select id="fA">${D.areas.map(a=>`<option value="${a.id}" ${a.id===c.area?"selected":""}>${a.name}</option>`).join("")}</select></div>
    <div id="sw">${subSel(c.area)}</div>
    <div class="fd row"><div><label>Datum</label><input type="date" id="fD" value="${c.date}"></div>
      <div><label>Status</label><select id="fSt">
        <option value="planned" ${c.status==="planned"?"selected":""}>Geplant</option>
        <option value="progress" ${c.status==="progress"?"selected":""}>Läuft</option>
        <option value="done" ${c.status==="done"?"selected":""}>Erreicht</option></select></div></div>
    <div class="fd"><label>Titel</label><input id="fT" value="${esc(c.title)}" placeholder="z. B. HSK 4 vollständig aktiv"></div>
    <div class="fd"><label>Woran du es merkst</label><textarea id="fM" placeholder="Das Zeichen, an dem du erkennst: geschafft.">${esc(c.metric)}</textarea></div>
    <label style="display:flex;gap:9px;align-items:center;font-size:13px;color:var(--muted);cursor:pointer">
      <input type="checkbox" id="fJ" style="width:auto" ${c.major?"checked":""}> Großer Meilenstein</label>
    <div class="mact"><button class="btn" id="mC">Abbrechen</button><button class="btn dark" id="mS">Speichern</button></div>`;
  openOv();
  document.getElementById("fA").onchange=e=>{document.getElementById("sw").innerHTML=subSel(e.target.value);};
  document.getElementById("mC").onclick=closeOv;
  document.getElementById("mS").onclick=async()=>{
    const sEl=document.getElementById("fS");
    const o={area:document.getElementById("fA").value,date:document.getElementById("fD").value,
      title:document.getElementById("fT").value.trim()||"Ohne Titel",
      metric:document.getElementById("fM").value.trim(),status:document.getElementById("fSt").value,
      major:document.getElementById("fJ").checked};
    const sv=sEl?sEl.value:"";
    if(isNew){o.id="m"+Date.now();if(sv)o.subject=sv;D.ms.push(o);}
    else{const t=D.ms.find(x=>x.id===m.id);Object.assign(t,o);delete t.ph;
      if(sv)t.subject=sv;else delete t.subject;}
    await persist();closeOv();closeDw();render();};
}

function openSubject(area,editId){
  const ex=editId?D.subjects.find(s=>s.id===editId):null;
  let col=ex?ex.color:(PAL.find(c=>!D.subjects.some(s=>s.color===c))||PAL[0]);
  document.getElementById("md").innerHTML=`<h3>${ex?"Fach bearbeiten":"Neues Fach"}</h3>
    <div class="fd"><label>Name</label><input id="sN" value="${ex?esc(ex.name):""}" placeholder="z. B. Deutsch LK, Geschichte GK"></div>
    <div class="fd"><label>Farbe</label><div class="crow" id="cr">
      ${PAL.map(c=>`<div class="cs2 ${c===col?"on":""}" data-c="${c}" style="background:${c}"></div>`).join("")}</div></div>
    <div class="mact">${ex?`<button class="btn danger" id="sDel">Löschen</button>`:""}
      <button class="btn" id="mC">Abbrechen</button><button class="btn dark" id="mS">Speichern</button></div>`;
  openOv();
  document.querySelectorAll("#cr .cs2").forEach(x=>x.onclick=()=>{col=x.dataset.c;
    document.querySelectorAll("#cr .cs2").forEach(y=>y.classList.remove("on"));x.classList.add("on");});
  document.getElementById("mC").onclick=closeOv;
  const del=document.getElementById("sDel");
  if(del)del.onclick=async()=>{if(confirm(`Fach „${ex.name}" mit allen Zielen löschen?`)){
    D.subjects=D.subjects.filter(s=>s.id!==ex.id);D.ms=D.ms.filter(m=>m.subject!==ex.id);
    D.steps=D.steps.filter(s=>s.subject!==ex.id);await persist();closeOv();go("area",ex.area);}};
  document.getElementById("mS").onclick=async()=>{
    const nm=document.getElementById("sN").value.trim();if(!nm)return document.getElementById("sN").focus();
    if(ex){ex.name=nm;ex.color=col;delete ex.placeholder;}
    else D.subjects.push({id:"su"+Date.now(),area,name:nm,color:col});
    await persist();closeOv();render();};
}

function seriesEditor(area){
  let col=D.areas.find(a=>a.id===area).color;
  document.getElementById("md").innerHTML=`<h3>Neue Kennzahl</h3>
    <div class="fd"><label>Name</label><input id="kN" placeholder="z. B. Bankdrücken 1RM"></div>
    <div class="fd"><label>Einheit</label><input id="kU" placeholder="z. B. kg, Wörter, Sekunden"></div>
    <div class="fd row"><div><label>Heute</label><input type="number" id="kV" placeholder="aktueller Wert"></div>
      <div><label>Zielwert</label><input type="number" id="kTV" placeholder="Ziel"></div></div>
    <div class="fd"><label>Zieldatum</label><input type="date" id="kTD"></div>
    <div class="fd"><label>Farbe</label><div class="crow" id="cr">
      ${PAL.map(c=>`<div class="cs2 ${c===col?"on":""}" data-c="${c}" style="background:${c}"></div>`).join("")}</div></div>
    <div class="mact"><button class="btn" id="mC">Abbrechen</button><button class="btn dark" id="mS">Anlegen</button></div>`;
  openOv();
  document.querySelectorAll("#cr .cs2").forEach(x=>x.onclick=()=>{col=x.dataset.c;
    document.querySelectorAll("#cr .cs2").forEach(y=>y.classList.remove("on"));x.classList.add("on");});
  document.getElementById("mC").onclick=closeOv;
  document.getElementById("mS").onclick=async()=>{
    const nm=document.getElementById("kN").value.trim();if(!nm)return document.getElementById("kN").focus();
    const v=parseFloat(document.getElementById("kV").value),tv=parseFloat(document.getElementById("kTV").value),
      td=document.getElementById("kTD").value;
    const pts=[];
    if(!isNaN(v)){pts.push({date:iso(),value:v,plan:true});pts.push({date:iso(),value:v});}
    if(td&&!isNaN(tv))pts.push({date:td,value:tv,plan:true});
    D.series.push({id:"k"+Date.now(),area,name:nm,unit:document.getElementById("kU").value.trim(),color:col,points:pts});
    await persist();closeOv();render();};
}

function logVal(id){
  const se=D.series.find(s=>s.id===id);
  document.getElementById("md").innerHTML=`<h3>Stand eintragen</h3>
    <div class="note" style="margin-bottom:18px">${esc(se.name)} — trag ein, wo du heute wirklich stehst. Die Linie klettert dann sichtbar.</div>
    <div class="fd row"><div><label>Datum</label><input type="date" id="lD" value="${iso()}"></div>
      <div><label>Wert</label><input type="number" id="lV" placeholder="z. B. 2680"></div></div>
    <div class="mact"><button class="btn" id="mC">Abbrechen</button><button class="btn dark" id="mS">Speichern</button></div>`;
  openOv();
  document.getElementById("mC").onclick=closeOv;
  document.getElementById("mS").onclick=async()=>{const dt=document.getElementById("lD").value,
    v=parseFloat(document.getElementById("lV").value);
    if(!dt||isNaN(v))return;se.points.push({date:dt,value:v});await persist();closeOv();render();};
}

function dataMenu(){
  document.getElementById("md").innerHTML=`<h3>Daten &amp; Backup</h3>
    <div class="note" style="margin-bottom:18px">Alles speichert sich automatisch. Zum Sichern oder Umziehen exportieren.</div>
    <div class="fd"><button class="btn block" id="ex">Export als JSON</button></div>
    <div class="fd"><label>Import</label><textarea id="im" placeholder="JSON hier einfügen"></textarea>
      <button class="btn block" id="imb" style="margin-top:9px">Importieren</button></div>
    <div class="mact"><button class="btn" id="mC">Schließen</button><button class="btn danger" id="rs">Zurücksetzen</button></div>`;
  openOv();
  document.getElementById("mC").onclick=closeOv;
  document.getElementById("ex").onclick=()=>{const b=new Blob([JSON.stringify(D,null,2)],{type:"application/json"});
    const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="wegmarken-"+iso()+".json";a.click();URL.revokeObjectURL(a.href);};
  document.getElementById("imb").onclick=async()=>{try{const o=JSON.parse(document.getElementById("im").value);
    if(!o.ms)throw 0;D=norm(o);await persist();closeOv();go("overview");}catch(e){alert("Import fehlgeschlagen — gültiges JSON einfügen.");}};
  document.getElementById("rs").onclick=async()=>{if(confirm("Alles zurücksetzen?")){D=seed();await persist();closeOv();go("overview");}};
}

/* ============ WOCHEN-UPDATE (Patch) ============
   Patch-Format (alle Felder optional):
   { "stand":"2026-08-30",
     "notiz":"KW 32 abgeschlossen",
     "log":[{"kennzahl":"zh_w","datum":"2026-08-30","wert":2680}],
     "status":[{"id":"zh1","status":"progress"}],
     "schritte":[{"bereich":"zh","ersetzen":true,
                  "items":[{"text":"KW 33 Batch","takt":"sonntags"}]}],
     "neu":[{"bereich":"zh","datum":"2026-09-30","titel":"…","messbar":"…"}] }
============================================================ */
function applyPatch(p){
  const log=[];
  if(Array.isArray(p.log))p.log.forEach(e=>{
    const se=D.series.find(s=>s.id===(e.kennzahl||e.series));
    if(!se)return log.push(`Kennzahl „${e.kennzahl||e.series}" nicht gefunden`);
    const dt=e.datum||e.date, v=parseFloat(e.wert!==undefined?e.wert:e.value);
    if(!dt||isNaN(v))return;
    se.points=se.points.filter(x=>!(x.date===dt&&!x.plan));
    se.points.push({date:dt,value:v});
    log.push(`${se.name}: ${nf(v)} am ${fmt(d(dt))}`);
  });
  if(Array.isArray(p.status))p.status.forEach(e=>{
    const m=D.ms.find(x=>x.id===e.id);
    if(!m)return log.push(`Meilenstein „${e.id}" nicht gefunden`);
    if(e.status)m.status=e.status;
    if(e.datum||e.date)m.date=e.datum||e.date;
    if(e.messbar||e.metric)m.metric=e.messbar||e.metric;
    if(e.titel||e.title)m.title=e.titel||e.title;
    log.push(`„${m.title}" → ${({planned:"geplant",progress:"läuft",done:"erreicht"})[m.status]||m.status}`);
  });
  if(Array.isArray(p.schritte))p.schritte.forEach(g=>{
    const ar=g.bereich||g.area, su=g.fach||g.subject;
    if(g.ersetzen||g.replace)
      D.steps=D.steps.filter(s=>su?s.subject!==su:!(s.area===ar&&!s.subject));
    (g.items||[]).forEach(it=>{
      const o={id:"st"+Date.now()+Math.random().toString(36).slice(2,6),
        text:it.text,cad:it.takt||it.cad||"",done:false};
      if(su)o.subject=su; if(ar)o.area=ar;
      D.steps.push(o);
    });
    log.push(`${(g.items||[]).length} Schritte für ${su||ar}`);
  });
  if(Array.isArray(p.neu))p.neu.forEach(e=>{
    const o={id:e.id||("m"+Date.now()+Math.random().toString(36).slice(2,6)),
      area:e.bereich||e.area,date:e.datum||e.date,
      title:e.titel||e.title||"Ohne Titel",metric:e.messbar||e.metric||"",
      status:e.status||"planned",major:!!(e.gross||e.major)};
    if(e.fach||e.subject)o.subject=e.fach||e.subject;
    D.ms.push(o);
    log.push(`Neu: „${o.title}"`);
  });
  if(Array.isArray(p.faecher))p.faecher.forEach(f=>{
    if(D.subjects.some(s=>s.id===f.id))return;
    D.subjects.push({id:f.id||("su"+Date.now()+Math.random().toString(36).slice(2,6)),
      area:f.bereich||f.area||"schule",name:f.name,color:f.farbe||f.color||PAL[D.subjects.length%PAL.length]});
    log.push(`Fach: ${f.name}`);
  });
  D.meta=D.meta||{};
  D.meta.lastUpdate=p.stand||p.date||iso();
  if(p.notiz||p.note)D.meta.lastNote=p.notiz||p.note;
  return log;
}

function updateMenu(){
  const last=D.meta&&D.meta.lastUpdate;
  const weeks=last?Math.floor(diff(TODAY,d(last))/7):null;
  document.getElementById("md").innerHTML=`<h3>Wochen-Update</h3>
    <div class="note" style="margin-bottom:18px">
      ${last?`Letzter Stand: <b>${fmt(d(last))}</b>${weeks!==null&&weeks>0?` — vor ${weeks} ${weeks===1?"Woche":"Wochen"}`:" — aktuell"}.`:"Noch kein Update eingespielt."}
      ${D.meta&&D.meta.lastNote?`<br>${esc(D.meta.lastNote)}`:""}
    </div>
    <div class="fd"><label>Update von Claude einfügen</label>
      <textarea id="up" style="min-height:150px;font-size:13px" placeholder='{ "stand": "2026-08-30", "log": [ … ] }'></textarea></div>
    <div class="fd"><button class="btn block" id="cpPrompt">Update-Prompt kopieren</button></div>
    <div class="mact"><button class="btn" id="mC">Abbrechen</button><button class="btn dark" id="mS">Einspielen</button></div>`;
  openOv();
  document.getElementById("mC").onclick=closeOv;
  document.getElementById("cpPrompt").onclick=()=>{
    const t=`Bitte aktualisiere meine Wegmarken-App. Durchsuche meine Chats (Chinesisch, Spanisch, Schule) nach dem Lernstand seit ${last?fmt(d(last)):"dem letzten Mal"} und gib mir NUR das JSON-Patch-Objekt zurück, ohne Erklärung drumherum.`;
    navigator.clipboard&&navigator.clipboard.writeText(t);
    const b=document.getElementById("cpPrompt");b.textContent="Kopiert ✓";
    setTimeout(()=>{b.textContent="Update-Prompt kopieren";},1600);
  };
  document.getElementById("mS").onclick=async()=>{
    let raw=document.getElementById("up").value.trim();
    raw=raw.replace(/^```(?:json)?/,"").replace(/```$/,"").trim();
    let p;try{p=JSON.parse(raw);}catch(e){return alert("Das ist kein gültiges JSON. Kopier das Objekt noch einmal komplett — von { bis }.");}
    const log=applyPatch(p);
    await persist();closeOv();go("overview");
    setTimeout(()=>alert("Update eingespielt:\n\n"+(log.length?log.join("\n"):"Keine Änderungen erkannt.")),80);
  };
}

/* ============ EVENTS ============ */
document.getElementById("bAdd").onclick=()=>editor(null,R.view==="subject"?
  (D.subjects.find(s=>s.id===R.id)||{}).area:(R.view==="area"?R.id:null),R.view==="subject"?R.id:null);
document.getElementById("bData").onclick=dataMenu;
document.getElementById("bTheme").onclick=()=>{
  const cur=document.documentElement.getAttribute("data-theme");
  const next=cur==="dark"?"light":"dark";
  document.documentElement.setAttribute("data-theme",next);
  try{localStorage.setItem("wegmarken-theme",next);}catch(e){}
  if(D)render();
};
document.getElementById("bUp").onclick=updateMenu;
document.getElementById("dwClose").onclick=closeDw;
document.getElementById("ov").onclick=e=>{if(e.target.id==="ov")closeOv();};
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeOv();closeDw();}});
let rz;window.addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>{if(D)render();},200);});

/* ============ INIT ============ */
(async function(){const l=await load();D=l?norm(l):seed();if(!l)await persist();await loadXP();render();})();
</script>
