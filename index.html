<head>

</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>

</head>
<body>
<div id="root">
  <div style="background:#191919;min-height:100vh;display:flex;align-items:center;justify-content:center;color:#999;font-family:Inter,system-ui;font-size:12px;">Wird geladen…</div>
</div>

<script type="text/babel">
const { useState, useEffect } = React;

// ─── Konfiguration ──────────────────────────────────────────────────────────
const STORAGE_KEY   = "life-os-v4";
const NOTION_XP_URL = "./notion-xp.json";

const SKILLS = {
  chinese: { label: "Chinesisch",      abbr: "ZH", color: "#68a672" },
  sport:   { label: "Sport & Körper",  abbr: "SP", color: "#b08948" },
  school:  { label: "Schule & Abitur", abbr: "SC", color: "#5b8fc9" },
  neben:   { label: "Nebenprojekte",   abbr: "NP", color: "#b56bb0" },
};

// Neu kalibrierte Skala — deutlich höhere Schwellen, mehr Raum nach oben
const THRESHOLDS = [0, 500, 1200, 2200, 3600, 5500, 8000, 11000, 15000, 20000, 26000];
const STUFEN = [
  "Anfang","Aufbau","Solide","Fortgeschritten","Kompetent",
  "Stark","Fortgeschritten+","Sehr stark","Exzellent","Meisterhaft",
];

const DEFAULT_SCHWIERIGKEIT = [
  { label:"Täglich",     xp:5   },
  { label:"Standard",    xp:15  },
  { label:"Komplex",     xp:30  },
  { label:"Kritisch",    xp:60  },
  { label:"Meilenstein", xp:100 },
];

// Realistischer, moderater Startstand → Gesamt ~Stufe 4
const BASE_XP = { chinese: 1150, sport: 780, school: 1400, neben: 220 };

const DEFAULT_ERFOLGE = [
  { id:"e1",  name:"Erster Eintrag",        desc:"XP erstmals vergeben",                  done:"2026-06-15" },
  { id:"e2",  name:"Batch abgeschlossen",    desc:"Anki-Batch fertiggestellt",             done:"2026-08-01" },
  { id:"e3",  name:"1.000 Vokabeln",         desc:"1.000 chinesische Vokabeln aktiv",      done:"2026-07-10" },
  { id:"e4",  name:"5.000 Vokabeln",         desc:"5.000 chinesische Vokabeln aktiv",      done:"2026-07-28" },
  { id:"e5",  name:"Wochenreflexion",        desc:"Ersten Wochen-Review abgeschlossen",    done:"2026-08-10" },
  { id:"e6",  name:"Erstes Gespräch",        desc:"Freies Gespräch auf Chinesisch",        done:"2026-07-15" },
  { id:"e7",  name:"Klausur bestanden",      desc:"Schriftliche Prüfung mit ≥ 14 Punkten", done:null },
  { id:"e8",  name:"Block 1 abgeschlossen",  desc:"Powerbuilding-Phase 1 vollständig",     done:null },
  { id:"e9",  name:"7-Tage-Serie",           desc:"Sieben Tage Praxis ohne Lücke",         done:null },
  { id:"e10", name:"Shanghai",               desc:"Internship gestartet",                  done:null },
];

const DEFAULT_MEILENSTEINE = {
  chinese: [
    {id:"c1", text:"Batch 4 fertigstellen",           done:false},
    {id:"c2", text:"Batch 5 fertigstellen",           done:false},
    {id:"c3", text:"Batch 6 fertigstellen",           done:false},
    {id:"c4", text:"Täglichen Input-Slot etablieren", done:false},
    {id:"c5", text:"Gesprächspartner finden",         done:false},
  ],
  sport: [
    {id:"s1", text:"Diätphase abschließen",          done:false},
    {id:"s2", text:"Block 1 · Wochen 1–2",           done:false},
    {id:"s3", text:"Block 1 · Wochen 3–4",           done:false},
    {id:"s4", text:"Block 1 · Wochen 5–6 + Deload", done:false},
  ],
  school: [
    {id:"g1", text:"Anki-System Mathe + Chemie aufgebaut", done:true},
    {id:"g2", text:"Erdkunde-Lernstrategie entwickeln",    done:false},
    {id:"g3", text:"Erste fünf Übungsklausuren",           done:false},
    {id:"g4", text:"Klausurdaten eingetragen (September)", done:false},
  ],
  neben: [
    {id:"n1", text:"Handschrift: Daumen-Position korrigieren", done:false},
    {id:"n2", text:"Handschrift: Drill-Sheets flüssig",        done:false},
  ],
};

const BLANK = {
  synced_xp: { ...BASE_XP },
  manual_xp: { chinese:0, sport:0, school:0, neben:0 },
  synced_at: null,
  schwierigkeit: DEFAULT_SCHWIERIGKEIT,
  erfolge: DEFAULT_ERFOLGE,
  meilensteine: DEFAULT_MEILENSTEINE,
  log: [
    {ts:"10.08.2026", skill:"school",  xp:30,  src:"notion", note:"Anki Mathe & Chemie aufgebaut"},
    {ts:"01.08.2026", skill:"chinese", xp:100, src:"notion", note:"Batch 3 abgeschlossen"},
  ],
};

// ─── Helpers ────────────────────────────────────────────────────────────────
const getLvl = xp => { let l=1; for(let i=1;i<THRESHOLDS.length;i++) if(xp>=THRESHOLDS[i]) l=i+1; else break; return Math.min(l,10); };
const getBar = xp => {
  const l=getLvl(xp); if(l>=10) return {pct:100,cur:xp-THRESHOLDS[9],needed:6000};
  const s=THRESHOLDS[l-1],e=THRESHOLDS[l]; return {pct:Math.round(((xp-s)/(e-s))*100),cur:xp-s,needed:e-s};
};
const addXP  = (a,b) => { const r={}; for(const k in a) r[k]=(a[k]||0)+(b[k]||0); return r; };
const sumAll = o => Object.values(o).reduce((a,b)=>a+b,0);
const pad2   = n => String(n).padStart(2,"0");
const uid    = () => Math.random().toString(36).slice(2,9);
const fmtSync = iso => iso ? new Date(iso).toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}) : null;

const Storage = {
  get(k){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):null; }catch{ return null; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch{} },
};
async function fetchNotionXP(){ try{ const r=await fetch(NOTION_XP_URL,{cache:"no-store"}); return r.ok?await r.json():null; }catch{ return null; } }

// ─── CSS · Notion Dark (#191919) ────────────────────────────────────────────
const css = `

  .sync-dot.stale{background:#777}

  .tabs{display:flex;border-bottom:1px solid rgba(255,255,255,.09);overflow-x:auto}
  .tab{padding:11px 13px;font-size:12px;font-weight:600;border:none;background:none;cursor:pointer;transition:color .15s;margin-bottom:-1px;white-space:nowrap;letter-spacing:.01em}

  .sk-card{padding:17px 0;border-bottom:1px solid rgba(255,255,255,.07)}

  .notion-note{font-size:10px;color:#9b9b9b;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);border-radius:4px;padding:6px 9px;margin-bottom:10px;line-height:1.5}

  .btn-add{width:100%;padding:8px;background:none;border:1px dashed rgba(255,255,255,.15);color:#9b9b9b;border-radius:5px;font-size:11px;cursor:pointer;font-weight:500;transition:all .15s}
  .btn-add:hover{border-color:rgba(255,255,255,.28);color:#c4c4c4}

  .ms-sec{padding-top:18px}
  .ms-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
  .ms-lbl{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#b8b8b8}
  .ms-prog{font-size:10px;font-weight:600;font-variant-numeric:tabular-nums}
  .ms-bar{height:2px;background:rgba(255,255,255,.09);border-radius:99px;margin-bottom:12px;overflow:hidden}
  .ms-bfill{height:100%;border-radius:99px;transition:width .5s}
  .ms-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.05)}
  .ms-item:last-child{border-bottom:none}
  .ms-chk{width:16px;height:16px;border-radius:3px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;transition:all .15s;cursor:pointer}
  .ms-txt{font-size:12.5px;flex:1;transition:color .15s;cursor:pointer}
  .ms-del{font-size:14px;color:#5f5f5f;cursor:pointer;background:none;border:none;padding:0 2px}
  .ms-del:hover{color:#c96a5f}

  .ms-input:focus{outline:none;border-color:rgba(255,255,255,.3)}

  .add-erfolg:hover{border-color:rgba(255,255,255,.28);color:#c4c4c4}

// ─── App ─────────────────────────────────────────────────────────────────────
function App(){
  const [data,setData]       = useState(null);
  const [loading,setLoading] = useState(true);
  const [tab,setTab]         = useState("fortschritt");
  const [picking,setPicking] = useState(null);
  const [preset,setPreset]   = useState(1);
  const [toast,setToast]     = useState(null);
  const [msInput,setMsInput] = useState({});
  const [modal,setModal]     = useState(null); // {name, desc}

  useEffect(()=>{ (async()=>{
    const saved = Storage.get(STORAGE_KEY);
    let state = saved ? saved : JSON.parse(JSON.stringify(BLANK));
    // Migrations-Guard
    if(!state.synced_xp) state.synced_xp={...BASE_XP};
    if(!state.manual_xp) state.manual_xp={chinese:0,sport:0,school:0,neben:0};
    if(state.manual_xp.neben===undefined) state.manual_xp.neben=0;
    if(state.synced_xp.neben===undefined) state.synced_xp.neben=BASE_XP.neben;
    if(!state.schwierigkeit) state.schwierigkeit=DEFAULT_SCHWIERIGKEIT;
    if(!Array.isArray(state.erfolge)) state.erfolge=DEFAULT_ERFOLGE;
    if(!state.meilensteine) state.meilensteine=DEFAULT_MEILENSTEINE;
    if(!state.meilensteine.neben) state.meilensteine.neben=DEFAULT_MEILENSTEINE.neben;
    const notionData = await fetchNotionXP();
    if(notionData?.total_xp){
      state.synced_xp = { ...state.synced_xp, ...notionData.total_xp };
      state.synced_at = notionData.synced_at;
    }
    setData(state); setLoading(false);
  })(); },[]);

  useEffect(()=>{ if(data&&!loading) Storage.set(STORAGE_KEY,data); },[data,loading]);

  const notify = m => { setToast(m); setTimeout(()=>setToast(null),2500); };

  const gainManualXP = (skill,amount,reason) => {
    if(!amount||amount<=0) return;
    setData(p=>{
      const manual={...p.manual_xp,[skill]:(p.manual_xp[skill]||0)+amount};
      const entry={ts:new Date().toLocaleDateString("de-DE"),skill,xp:amount,src:"manual",note:reason};
      return {...p,manual_xp:manual,log:[entry,...(p.log||[])].slice(0,40)};
    });
    notify(`+${amount} XP · ${SKILLS[skill].label}`);
    setPicking(null);
  };

  const toggleErfolg = id => setData(p=>({
    ...p, erfolge:p.erfolge.map(e=>e.id===id?{...e,done:e.done?null:new Date().toISOString().slice(0,10)}:e)
  }));
  const delErfolg = id => setData(p=>({...p,erfolge:p.erfolge.filter(e=>e.id!==id)}));
  const addErfolg = (name,desc) => {
    if(!name.trim()) return;
    setData(p=>({...p,erfolge:[...p.erfolge,{id:uid(),name:name.trim(),desc:desc.trim(),done:null}]}));
    setModal(null); notify("Erfolg hinzugefügt");
  };

  const toggleMS = (skill,mid) => setData(p=>{
    const ms=p.meilensteine[skill], wasOpen=!ms.find(m=>m.id===mid)?.done;
    const newMs={...p.meilensteine,[skill]:ms.map(m=>m.id===mid?{...m,done:!m.done}:m)};
    if(wasOpen){
      const manual={...p.manual_xp,[skill]:(p.manual_xp[skill]||0)+30};
      notify("Meilenstein erreicht — +30 XP");
      return {...p,meilensteine:newMs,manual_xp:manual};
    }
    return {...p,meilensteine:newMs};
  });
  const delMS = (skill,mid) => setData(p=>({...p,meilensteine:{...p.meilensteine,[skill]:p.meilensteine[skill].filter(m=>m.id!==mid)}}));
  const addMS = skill => {
    const text=(msInput[skill]||"").trim(); if(!text) return;
    setData(p=>({...p,meilensteine:{...p.meilensteine,[skill]:[...p.meilensteine[skill],{id:uid(),text,done:false}]}}));
    setMsInput(s=>({...s,[skill]:""}));
  };

  if(loading||!data) return null;

  const xp       = addXP(data.synced_xp,data.manual_xp);
  const total    = sumAll(xp);
  const totalLvl = getLvl(total);
  const totalBar = getBar(total);
  const doneCount= data.erfolge.filter(e=>e.done).length;
  const isStale  = data.synced_at && (Date.now()-new Date(data.synced_at).getTime()>26*3600*1000);

  return (
    <div className="root">
      <style>{css}</style>
      <div className={`toast ${toast?"show":""}`}>{toast||""}</div>

      {/* Modal für neuen Erfolg */}
      {modal && (
        <div className="modal-bg" onClick={e=>{if(e.target===e.currentTarget)setModal(null);}}>
          <div className="modal">
            <div className="modal-title">Neuer Erfolg</div>
            <input className="modal-input" placeholder="Name" value={modal.name}
              onChange={e=>setModal({...modal,name:e.target.value})} autoFocus/>
            <input className="modal-input" placeholder="Beschreibung (optional)" value={modal.desc}
              onChange={e=>setModal({...modal,desc:e.target.value})}/>
            <div className="modal-row">
              <button className="modal-ok" onClick={()=>addErfolg(modal.name,modal.desc)}>Hinzufügen</button>
              <button className="modal-x" onClick={()=>setModal(null)}>Abbrechen</button>
            </div>
          </div>
        </div>
      )}

      {/* Header */}
      <div className="hdr">
        <div className="inner">
          <div className="hdr-row">
            <div>
              <div className="hdr-name">Collin Adolph</div>
              <div className="hdr-sub">{STUFEN[totalLvl-1]} · {total.toLocaleString("de-DE")} XP gesamt</div>
            </div>
            <div className="hdr-lvl-wrap">
              <div className="hdr-lvl-lbl">Stufe</div>
              <div className="hdr-lvl-num">{pad2(totalLvl)}</div>
              <div className="hdr-lvl-ttl">{STUFEN[totalLvl-1]}</div>
            </div>
          </div>
          <div className="bar-row">
            <span>{totalBar.cur.toLocaleString("de-DE")} / {totalBar.needed.toLocaleString("de-DE")} XP</span>
            <span>→ Stufe {pad2(Math.min(totalLvl+1,10))}</span>
          </div>
          <div className="bar-wrap"><div className="bar-fill" style={{width:`${totalBar.pct}%`,background:"#d9a758"}}/></div>
          <div className="sync-row">
            <div className={`sync-dot ${isStale?"stale":""}`}/>
            <span>{data.synced_at?`Notion-Sync: ${fmtSync(data.synced_at)}`:"Notion-Sync: noch nicht konfiguriert"}</span>
          </div>
        </div>
      </div>

      <div className="inner">
        <div className="tabs">
          {[["fortschritt","Fortschritt"],["erfolge",`Erfolge (${doneCount}/${data.erfolge.length})`],["meilensteine","Meilensteine"],["verlauf","Verlauf"]].map(([id,lbl])=>(
            <button key={id} className={`tab ${tab===id?"on":"off"}`} onClick={()=>setTab(id)}>{lbl}</button>
          ))}
        </div>

        {/* FORTSCHRITT */}
        {tab==="fortschritt" && (
          <div style={{paddingTop:4}}>
            {Object.entries(SKILLS).map(([key,sk])=>{
              const sx=xp[key]||0, lvl=getLvl(sx), bar=getBar(sx), open=picking===key;
              const synced=data.synced_xp[key]||0, manual=data.manual_xp[key]||0;
              return (
                <div key={key} className="sk-card">
                  <div className="sk-top">
                    <div>
                      <div className="sk-name">{sk.label}</div>
                      <div className="sk-sub">{STUFEN[lvl-1]}</div>
                      <div className="sk-detail">{synced.toLocaleString("de-DE")} Notion{manual>0?` + ${manual.toLocaleString("de-DE")} manuell`:""}</div>
                    </div>
                    <div className="sk-right">
                      <div className="sk-lvl" style={{color:sk.color}}>{pad2(lvl)}</div>
                      <div className="sk-xp">{sx.toLocaleString("de-DE")} XP</div>
                    </div>
                  </div>
                  <div className="bar-wrap"><div className="bar-fill" style={{width:`${bar.pct}%`,background:sk.color}}/></div>
                  <div className="bar-lbl">
                    <span>{bar.cur.toLocaleString("de-DE")} / {bar.needed.toLocaleString("de-DE")} XP bis Stufe {pad2(Math.min(lvl+1,10))}</span>
                    <span>{bar.pct}%</span>
                  </div>
                  {open ? (
                    <div>
                      <div className="notion-note">Notion-Aufgaben werden täglich automatisch gezählt. Hier nur Aktivitäten außerhalb von Notion eintragen.</div>
                      <div className="p-opts">
                        {data.schwierigkeit.map((s,i)=>(
                          <button key={i} className="p-opt" onClick={()=>setPreset(i)} style={{
                            borderColor:preset===i?sk.color:"rgba(255,255,255,.14)",
                            background:preset===i?`${sk.color}26`:"none",
                            color:preset===i?sk.color:"#b0b0b0",
                          }}>{s.label} +{s.xp}</button>
                        ))}
                      </div>
                      <div className="p-row">
                        <button className="btn-ok" style={{background:sk.color,color:"#191919"}}
                          onClick={()=>gainManualXP(key,data.schwierigkeit[preset].xp,data.schwierigkeit[preset].label)}>
                          +{data.schwierigkeit[preset].xp} XP eintragen
                        </button>
                        <button className="btn-x" onClick={()=>setPicking(null)}>Abbrechen</button>
                      </div>
                    </div>
                  ) : (
                    <button className="btn-add" onClick={()=>{setPicking(key);setPreset(1);}}>Manueller XP-Eintrag</button>
                  )}
                </div>
              );
            })}
          </div>
        )}

        {/* ERFOLGE */}
        {tab==="erfolge" && (
          <div className="eg-grid">
            {data.erfolge.map(e=>{
              const done=!!e.done;
              return (
                <div key={e.id} className={`eg-card ${done?"on":"off"}`}>
                  <button className="eg-del" onClick={()=>delErfolg(e.id)}>×</button>
                  <div className="eg-name" style={{color:done?"#e0b968":"#c4c4c4"}}>{e.name}</div>
                  <div className="eg-desc">{e.desc}</div>
                  {done
                    ? <div className="eg-date" onClick={()=>toggleErfolg(e.id)} style={{cursor:"pointer"}}>Erreicht {e.done}</div>
                    : <div className="eg-hint" onClick={()=>toggleErfolg(e.id)}>Klick zum Markieren</div>}
                </div>
              );
            })}
            <button className="add-erfolg" onClick={()=>setModal({name:"",desc:""})}>+ Erfolg hinzufügen</button>
          </div>
        )}

        {/* MEILENSTEINE */}
        {tab==="meilensteine" && (
          <div className="ms-sec">
            {Object.entries(SKILLS).map(([key,sk])=>{
              const ms=data.meilensteine[key]||[];
              const done=ms.filter(m=>m.done).length;
              const pct=ms.length?Math.round((done/ms.length)*100):0;
              return (
                <div key={key}>
                  <div className="ms-hdr">
                    <span className="ms-lbl">{sk.label}</span>
                    <span className="ms-prog" style={{color:sk.color}}>{done} / {ms.length}</span>
                  </div>
                  <div className="ms-bar"><div className="ms-bfill" style={{width:`${pct}%`,background:sk.color}}/></div>
                  {ms.map(m=>(
                    <div key={m.id} className="ms-item">
                      <div className="ms-chk" onClick={()=>toggleMS(key,m.id)} style={{
                        border:`1.5px solid ${m.done?sk.color:"rgba(255,255,255,.18)"}`,
                        background:m.done?sk.color:"none",color:"#191919",
                      }}>{m.done?"✓":""}</div>
                      <span className="ms-txt" onClick={()=>toggleMS(key,m.id)} style={{
                        color:m.done?"#7d7d7d":"#dcdcdc",textDecoration:m.done?"line-through":"none",
                      }}>{m.text}</span>
                      <button className="ms-del" onClick={()=>delMS(key,m.id)}>×</button>
                    </div>
                  ))}
                  <div className="ms-add">
                    <input className="ms-input" placeholder="Neuer Meilenstein…"
                      value={msInput[key]||""}
                      onChange={e=>setMsInput(s=>({...s,[key]:e.target.value}))}
                      onKeyDown={e=>{if(e.key==="Enter")addMS(key);}}/>
                    <button className="ms-addbtn" onClick={()=>addMS(key)}>+</button>
                  </div>
                  <div className="ms-gap"/>
                </div>
              );
            })}
          </div>
        )}

        {/* VERLAUF */}
        {tab==="verlauf" && (
          <div className="lg-sec">
            {(!data.log||data.log.length===0)?(
              <div className="lg-empty">Noch keine Einträge.</div>
            ):(
              <>
                {data.log.map((e,i)=>{
                  const sk=SKILLS[e.skill];
                  return (
                    <div key={i} className="lg-item">
                      <div className="lg-badge" style={{background:`${sk?.color}26`,color:sk?.color}}>{sk?.abbr}</div>
                      <div style={{flex:1}}>
                        <div className="lg-note">{e.note||sk?.label}</div>
                        <div className="lg-src">{e.src==="notion"?"via Notion":"manuell"}</div>
                      </div>
                      <span className="lg-date">{e.ts}</span>
                      <span className="lg-xp">+{e.xp}</span>
                    </div>
                  );
                })}
                <button className="lg-clr" onClick={()=>setData(p=>({...p,log:[]}))}>Verlauf leeren</button>
              </>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
